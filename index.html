<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GPSJ v4.56 — Interactive Capability Depth</title>
<style>:root{--n:#112957;--i:#12203d;--m:#6d7b99;--b:#f3f6fb;--l:#d8e1ef;--s:#eef3fb;--x:#3158f5;--p:#7c35ee}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--i);font-family:Inter,system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}header{background:var(--n);color:white;padding:18px 24px;position:sticky;top:0}.brand{display:flex;gap:14px;align-items:center}.logo{width:58px;height:58px;border-radius:17px;background:linear-gradient(135deg,var(--x),var(--p));display:grid;place-items:center;font-weight:900}.brand h1{margin:0;font-size:27px}.sub{opacity:.78}.nav{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.nav button{border:0;border-radius:13px;padding:12px 15px;background:#ffffff17;color:white;font-weight:800}.nav button.active{background:white;color:var(--i)}main{max-width:1180px;margin:auto;padding:20px}.shell{background:white;border:1px solid var(--l);border-radius:22px;overflow:hidden;min-height:680px}.top{padding:18px 20px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.k{font-size:12px;font-weight:900;color:#0d7b59;background:#e9f7f1;padding:6px 9px;border-radius:999px}.title{font-size:27px;font-weight:900;margin-top:7px}.muted{color:var(--m)}.btn{border:1px solid var(--l);background:var(--s);color:#204d94;border-radius:12px;padding:10px 13px;font-weight:800}.primary{background:linear-gradient(135deg,var(--x),var(--p));color:white;border:0}.content{padding:20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.card,.work{border:1px solid var(--l);border-radius:17px;padding:17px;background:white}.card p{color:var(--m);line-height:1.45}.input{width:100%;border:1px solid var(--l);border-radius:12px;padding:12px;margin:7px 0}.out{border-left:4px solid var(--x);background:var(--s);border-radius:11px;padding:13px;margin-top:12px;line-height:1.5}.media{min-height:220px;border-radius:15px;background:#0e2856;color:white;display:grid;place-items:center;text-align:center;padding:20px}.crumbs{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.crumb{border:1px solid var(--l);border-radius:999px;padding:5px 8px;font-size:12px}.notice{background:#e9f0fb;color:#204d94;padding:10px 14px;font-weight:800;margin-top:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}.nav button{flex:1 1 40%}main{padding:11px}.brand h1{font-size:21px}}</style></head>
<body><header><div class="brand"><div class="logo">GPSJ</div><div><h1>Global Pharma Scientist Journey</h1><div class="sub">Adaptive Science Engine v4.56 · Interactive capability depth · Evidence-aware · Touch-first</div></div></div><div class="nav" id="nav"></div><div class="notice">🌍 Public GPSJ access remains visible · sign in only to save, personalize and use role-based tools</div></header>
<main><section class="shell"><div class="top"><div><span class="k">FOCUSED WORKSPACE</span><div class="title" id="title">Home</div><div class="muted">Open → enter capability → interact inside it.</div><div class="crumbs" id="crumbs"></div></div><div><button class="btn" id="back">← Back</button> <button class="btn" id="root">Workspace home</button></div></div><div class="content" id="content"></div></section></main>
<script>
const A={home:'Home',my:'🧭 My GPSJ',learn:'📚 Learn',visual:'👁 Visual',research:'🔬 Research',lab:'🧪 Screen Lab',advance:'🚀 Advancement',create:'🎨 Create',market:'🛍 Marketplace',institutions:'🏛 Institutions',language:'🌐 Language',signin:'👤 Sign in'};let area='home',stack=[];const C=document.querySelector('#content'),T=document.querySelector('#title'),Cr=document.querySelector('#crumbs'),N=document.querySelector('#nav');
Object.entries(A).forEach(([k,v])=>{let b=document.createElement('button');b.textContent=v;b.dataset.a=k;b.onclick=()=>{area=k;stack=[];render()};N.appendChild(b)});
const D={home:[['Start learning','Field → domain → topic → adaptive lesson.','learn'],['Visual science','Image, camera or video scientific observation.','visual'],['Research evidence','Question → claims → evidence → reproducibility.','research'],['Screen Lab','Nearby instruments → observation/simulation.','lab']],learn:[['Explore science','Organized fields, domains and topics.','browse'],['Quick topic','Generate an adaptive lesson from any topic.','lesson'],['Practice & mastery','Adaptive recall and competency checkpoint.','quiz']],visual:[['Image / specimen analysis','Scientific observation, annotation and uncertainty.','visual'],['Visual lesson','Turn an observation into learning.','lesson']],research:[['Research question','Frame a question and evidence path.','research'],['Evidence intelligence','Separate science, uncertainty and regulatory evidence.','evidence']],lab:[['My environment','Declare instruments, sensors, devices or prototypes nearby.','lab'],['Observe / simulate','Read-only first; supervised testing separately gated.','lab']],advance:[['Career pathway','Skills → gaps → credentials → readiness.','career']],create:[['Scientific creation','Reports, explanations and teaching artifacts.','create']],market:[['Scientific marketplace','Resource workspace preserving broad science access.','generic']],institutions:[['Institution workspace','Tenant, role, policy and authorization-aware.','generic']],language:[['Scientific language','Terminology-preserving language workspace.','language']],signin:[['Sign in / profile','Save personalization and role-based tools.','generic']],my:[['Journey dashboard','Learning, research, projects and competency continuity.','generic']]};
function card(t,d,w){let e=document.createElement('div');e.className='card';e.innerHTML='<h3>'+t+'</h3><p>'+d+'</p>';let b=document.createElement('button');b.className='btn';b.textContent='Open';b.onclick=()=>openW(t,w);e.appendChild(b);return e}
function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.a===area));Cr.innerHTML='<span class="crumb">'+A[area]+'</span>'+stack.map(x=>'<span class="crumb">'+x.t+'</span>').join('');T.textContent=stack.length?stack.at(-1).t:A[area].replace(/^[^A-Za-z]+/,'');if(stack.length){C.innerHTML=stack.at(-1).h;return}let g=document.createElement('div');g.className='grid';D[area].forEach(x=>g.appendChild(card(...x)));C.replaceChildren(g)}
function openW(t,w){let h='<div class="work"><b>v4.56 INTERACTIVE WORKSPACE</b><h2>'+t+'</h2>';
if(w==='browse')h+=`<p>Choose a scientific field. The next level opens inside Learn.</p><select class="input" id="q"><option>Pharmaceutical sciences</option><option>Biology</option><option>Chemistry</option><option>Medicine</option><option>Engineering</option><option>Environmental science</option><option>Natural sciences</option></select><button class="btn primary" onclick="run('browse')">Open field</button><div id="out" class="out">Field → domains → topics → adaptive depth → lesson → practice → mastery.</div>`;
else if(w==='visual')h+=`<div class="media">AI-adapted scientific image / video area<br><small>camera · image · video · annotation · uncertainty</small></div><input type="file" class="input" accept="image/*,video/*"><textarea id="q" class="input" placeholder="What are you observing?"></textarea><button class="btn primary" onclick="run('visual')">Analyze observation</button><div id="out" class="out">Ready.</div>`;
else if(w==='lab')h+=`<input id="q" class="input" placeholder="Microscope, HPLC, sensor, balance, prototype..."><select id="mode" class="input"><option>Observation — read only</option><option>Simulation — virtual</option><option>Supervised testing — human confirmation</option><option>Real-world control — restricted</option></select><textarea id="purpose" class="input" placeholder="What do you want to observe, measure or test?"></textarea><button class="btn primary" onclick="run('lab')">Assess workflow</button><div id="out" class="out">Declare equipment physically available nearby. Read-only is default.</div>`;
else h+=`<textarea id="q" class="input" placeholder="Enter your topic, question, goal or request"></textarea><button class="btn primary" onclick="run('${w}')">Start</button><div id="out" class="out">This capability is now an interactive focused workspace rather than a blocked/static card.</div>`;
h+='</div>';stack.push({t,h});render()}
function run(w){let q=(document.querySelector('#q')||{}).value||'Current request',o=document.querySelector('#out');if(w==='browse')o.innerHTML='<b>'+q+'</b><br>Core domains → foundational topics → advanced topics → adaptive lesson → practice → mastery.';else if(w==='visual')o.innerHTML='<b>'+q+'</b><br>Visible features → candidate interpretation → uncertainty → comparison → scientific explanation → Learn / Research handoff.';else if(w==='lab'){let m=document.querySelector('#mode').value,p=document.querySelector('#purpose').value||'No goal entered';o.innerHTML='<b>'+q+'</b><br>Mode: '+m+'<br>Goal: '+p+'<br>Compatibility → identity/manual → permission → safety classification → observation/simulation. No physical command is transmitted by this prototype.'}else if(w==='research'||w==='evidence')o.innerHTML='<b>'+q+'</b><br>Question → claim decomposition → evidence class → provenance → uncertainty/conflict → reproducibility → jurisdiction/authorization when consequential.';else if(w==='lesson')o.innerHTML='<b>'+q+'</b><br>Core concept → mechanism → evidence → visual explanation → application → adaptive practice → mastery checkpoint.';else o.innerHTML='<b>'+q+'</b><br>Workspace activated with focused navigation and preserved context.'}
document.querySelector('#back').onclick=()=>{stack.pop();render()};document.querySelector('#root').onclick=()=>{stack=[];render()};render();
</script></body></html>
